<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF0F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A0B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8889E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Flower petals -->
  <g transform="translate(256, 230)">
    <!-- Top petal -->
    <ellipse cx="0" cy="-55" rx="38" ry="52" fill="url(#flower)" opacity="0.9"/>
    <!-- Top right -->
    <ellipse cx="48" cy="-28" rx="38" ry="52" fill="url(#flower)" opacity="0.85" transform="rotate(60, 48, -28)"/>
    <!-- Bottom right -->
    <ellipse cx="48" cy="28" rx="38" ry="52" fill="url(#flower)" opacity="0.8" transform="rotate(120, 48, 28)"/>
    <!-- Bottom -->
    <ellipse cx="0" cy="55" rx="38" ry="52" fill="url(#flower)" opacity="0.85" transform="rotate(180, 0, 55)"/>
    <!-- Bottom left -->
    <ellipse cx="-48" cy="28" rx="38" ry="52" fill="url(#flower)" opacity="0.8" transform="rotate(240, -48, 28)"/>
    <!-- Top left -->
    <ellipse cx="-48" cy="-28" rx="38" ry="52" fill="url(#flower)" opacity="0.85" transform="rotate(300, -48, -28)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="22" fill="#FFD4E0"/>
    <circle cx="0" cy="0" r="14" fill="#FFC4D4"/>
  </g>
  <!-- Stem -->
  <path d="M256 290 Q256 340 248 380 Q244 400 256 410" stroke="#9DB8A0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M250 350 Q230 330 220 340 Q230 355 250 350Z" fill="#B5CCB8" opacity="0.8"/>
  <!-- Small heart -->
  <g transform="translate(330, 170) scale(0.5)">
    <path d="M0,-15 C-20,-45 -60,-15 0,25 C60,-15 20,-45 0,-15Z" fill="#F4A0B8" opacity="0.6"/>
  </g>
</svg>
